name: Github Pages
on:
  workflow_dispatch:
  push:
    branches: ["main"]
    paths:
      - "docs/page/**"
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          sparse-checkout: "docs/page"
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: docs/wiki/package-lock.json
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Install VitePress
        working-directory: docs/page
        run: npm ci
      - name: Build with VitePress
        working-directory: docs/page
        run: npx vitepress build
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/page/.vitepress/dist
  deploy:
    name: Deploy
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
